name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # ubuntu-22.04 still ships Python 3.9 in setup-python's manifest
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[test]"
      - name: Run tests
        run: pytest -q
      - name: Smoke-test the CLI
        run: |
          sloth-tidy --help
          sloth-tidy --version
